name: Release

# One tag releases both: the Arrow library (through SwiftPM, which reads the tag) and the
# generator binary attached to the GitHub release, which the Homebrew cask points at.
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Release Arrow and the Generator
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          package: Generator

      - name: Run Tests
        run: make test

      - name: Generate Version File
        run: |
          make generate-version VERSION="${{ github.ref_name }}"

      - name: Build Release Binary
        run: make build-generator

      - name: Verify Binary
        run: |
          echo "🔍 Verifying binary works..."
          test "$(./Generator/bin/arrow --version)" = "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: Generator/bin/arrow
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The tap's main branch only takes pull requests, so the cask goes in on a
  # branch and through a PR that merges itself. Committing through the API
  # attributes the change to the token's owner, and needs no Homebrew here.
  homebrew:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    needs: [release]

    steps:
      - name: Write the Cask
        env:
          VERSION: ${{ github.ref_name }}
          BINARY_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/arrow
        run: |
          curl -fsSL -o arrow "$BINARY_URL"
          sha256=$(sha256sum arrow | awk '{print $1}')
          cat > arrow.rb <<'EOF'
          cask "arrow" do
            version "__VERSION__"
            sha256 "__SHA256__"

            url "https://github.com/AhmedOsman00/arrow/releases/download/#{version}/arrow"
            name "arrow"
            desc "Generates dependency registration code for the Arrow DI library"
            homepage "https://github.com/AhmedOsman00/arrow/tree/main/Generator"

            depends_on :macos

            binary "arrow"

            # The binary is not notarized, so Gatekeeper would quarantine it on first run.
            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "arrow"], chdir: "."
            end
          end
          EOF
          sed -i -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$sha256/" arrow.rb
          cat arrow.rb

      - name: Open and Merge the Tap PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
        run: |
          # gh api prints the error body on a 404, so only its exit status
          # says whether the cask exists.
          file_sha=""
          current=""
          if meta=$(gh api "repos/$TAP/contents/Casks/arrow.rb?ref=main" 2>/dev/null); then
            file_sha=$(jq -r .sha <<< "$meta")
            current=$(jq -r .content <<< "$meta" | base64 -d)
          fi
          if [ -n "$file_sha" ] && [ "$current" = "$(cat arrow.rb)" ]; then
            echo "The cask already describes $VERSION."
            exit 0
          fi

          branch="arrow-$VERSION"
          main_sha=$(gh api "repos/$TAP/git/ref/heads/main" --jq .object.sha)
          gh api -X DELETE "repos/$TAP/git/refs/heads/$branch" >/dev/null 2>&1 || true
          gh api "repos/$TAP/git/refs" -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null

          args=(-f message="arrow $VERSION" -f content="$(base64 -w0 arrow.rb)" -f branch="$branch")
          if [ -n "$file_sha" ]; then
            args+=(-f sha="$file_sha")
          fi
          gh api -X PUT "repos/$TAP/contents/Casks/arrow.rb" "${args[@]}" >/dev/null

          pr=$(gh pr create --repo "$TAP" --base main --head "$branch" \
            --title "arrow $VERSION" \
            --body "The cask for [arrow $VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION).")
          gh pr merge "$pr" --repo "$TAP" --squash --delete-branch
          echo "Merged $pr."
