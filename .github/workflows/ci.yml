name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arrow
            package: "."
            make: make
            lint: lint-library
            test: test-library
            tests: ArrowPackageTests
          - name: Generator
            package: Generator
            make: make -C Generator
            lint: lint
            test: test
            tests: ArrowGeneratorPackageTests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          package: ${{ matrix.package }}

      - name: Run Linter
        run: ${{ matrix.make }} ${{ matrix.lint }}

      - name: Run Tests
        run: ${{ matrix.make }} ${{ matrix.test }}

      - name: Summarize coverage
        run: |
          ./scripts/coverage-summary.sh "${{ matrix.package }}" "${{ matrix.tests }}" "${{ matrix.name }}" \
            | tee coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: coverage.md

  # Posts both packages' coverage as one PR comment, edited in place on later pushes. Fork and
  # Dependabot PRs get a read-only token, so they only have the summaries on their job pages.
  coverage-comment:
    name: Coverage comment
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write

    steps:
      - name: Download coverage summaries
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- coverage-report -->"
          {
            echo "$marker"
            echo "## Coverage"
            echo
            for summary in coverage-Arrow/coverage.md coverage-Generator/coverage.md; do
              cat "$summary"
              echo
            done
            echo "<sub>Commit ${{ github.event.pull_request.head.sha }}</sub>"
          } > comment.md

          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

  # Generates a registry with this commit's generator and runs it against this commit's Arrow,
  # so a change to either side that breaks generated code fails here.
  compatibility:
    name: Generator and Arrow compatibility
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          package: Compatibility

      - name: Generate, Build and Run
        run: make compatibility

  # The main branch ruleset requires this check, so it stands for every job above.
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-and-test, compatibility]

    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
